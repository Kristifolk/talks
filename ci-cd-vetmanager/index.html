<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Vetmanager — версии презентации</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(145deg, #00004f, #0874bb); color: #fff; }
    main { width: min(720px, calc(100% - 48px)); text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(2.2rem, 7vw, 4.6rem); }
    p { margin: 0 0 36px; color: #d8f4ff; font-size: 1.15rem; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    a { padding: 24px; border: 1px solid #72ddff; border-radius: 18px; background: rgba(255,255,255,.1); color: #fff; text-decoration: none; font-size: 1.35rem; font-weight: 700; }
    a:hover, a:focus-visible { background: rgba(114,221,255,.22); outline: 2px solid #72ddff; }
    small { display: block; margin-top: 8px; color: #d8f4ff; font-size: .85rem; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>CI/CD Vetmanager</h1>
    <p>Выберите версию презентации</p>
    <nav>
      <a href="v1/">Версия 1<small>зафиксированная версия</small></a>
      <a href="v2/">Версия 2<small>актуальная рабочая версия</small></a>
    </nav>
  </main>
</body>
</html>
